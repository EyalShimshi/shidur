org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
# Older libraries' keep rules (Room's, which Glance uses through WorkManager) say "-keep class A" and
# expect A's constructor to be kept too. AGP 9 stopped doing that by default, and the first R8
# build crashed at start in the emulator smoke test.
android.r8.strictFullModeForKeepRules=false
kotlin.code.style=official
