name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    # Weekly, so the cached debug signing key is never evicted (GitHub drops caches unused for 7 days).
    - cron: "17 3 * * 1"

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  KEYSTORE_CACHE_KEY: shidur-debug-keystore-v1

jobs:
  keep-signing-key:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Touch the cached debug signing key
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: ${{ env.KEYSTORE_CACHE_KEY }}

  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      # Every build is signed with the same debug key so a new APK installs over the previous one.
      - name: Restore the debug signing key
        id: keystore
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: ${{ env.KEYSTORE_CACHE_KEY }}

      - name: Build the debug APK
        run: gradle assembleDebug --stacktrace

      - name: Save the debug signing key
        if: steps.keystore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.android/debug.keystore
          key: ${{ env.KEYSTORE_CACHE_KEY }}

      - name: Rename the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "shidur-${{ github.run_number }}.apk"

      - name: Upload the APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: shidur-apk-${{ github.run_number }}
          path: shidur-${{ github.run_number }}.apk

      - name: Publish a GitHub release with the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Shidur build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: shidur-${{ github.run_number }}.apk
          body: |
            Debug build of commit ${{ github.sha }}.
            Install: open this page on your phone and tap the .apk file, or run
            `adb install -r shidur-${{ github.run_number }}.apk` on a computer.

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace
