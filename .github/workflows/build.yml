name: Build APK

on:
  push:
    branches: [main, master]
    # A tag such as v1.0.0 makes an official release: APK and Play app bundle (AAB).
    tags: ["v*"]
  workflow_dispatch:
  schedule:
    # Weekly, so the cached debug signing key is never evicted (GitHub drops caches unused for 7 days).
    - cron: "17 3 * * 1"

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  KEYSTORE_CACHE_KEY: shidur-debug-keystore-v1

jobs:
  keep-signing-key:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Touch the cached debug signing key
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: ${{ env.KEYSTORE_CACHE_KEY }}

  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the code
        uses: actions/checkout@v4
        with:
          # The previous commit is needed to check that a changed station list has a new version.
          fetch-depth: 0

      # Installed apps only download a station list whose catalogVersion is higher than theirs.
      - name: Check that a changed station list has a new version
        if: github.event_name == 'push' && github.ref_type == 'branch'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          file=app/src/main/assets/catalog.json
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null || git diff --quiet "$BEFORE" HEAD -- "$file"; then
            exit 0
          fi
          old=$(git show "$BEFORE:$file" | jq '.catalogVersion')
          new=$(jq '.catalogVersion' "$file")
          if [ "$new" -le "$old" ]; then
            message="catalog.json changed, but catalogVersion is still $new. Raise it (for example to $(date -u +%Y%m%d)01) so installed apps download the new list."
            echo "::error file=$file::$message"
            echo "## Station list: raise catalogVersion" >> "$GITHUB_STEP_SUMMARY"
            echo "$message" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      # Every build is signed with the same debug key so a new APK installs over the previous one,
      # until the release key is added as repository secrets (see MAINTAINING.md).
      - name: Restore the debug signing key
        id: keystore
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: ${{ env.KEYSTORE_CACHE_KEY }}

      - name: Restore the release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          IS_TAG: ${{ github.ref_type == 'tag' }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "$IS_TAG" = "true" ]; then
              echo "::error::Releases must be signed with the release key. Add the RELEASE_KEYSTORE_BASE64 and RELEASE_KEYSTORE_PASSWORD secrets first (MAINTAINING.md)."
              exit 1
            fi
            echo "No release key yet: signing with the debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build the release APK
        id: build
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          APP_VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          set -o pipefail
          tasks="assembleRelease"
          # Google Play takes an app bundle; only official releases need one.
          if [ "${{ github.ref_type }}" = "tag" ]; then tasks="$tasks bundleRelease"; fi
          gradle $tasks 2>&1 | tee build.log

      # Collects the useful error lines so they can be copied from the run's Summary page.
      - name: Show build errors in the summary
        if: failure() && steps.build.outcome == 'failure'
        run: |
          {
            echo "## Build errors (copy everything in the box below)"
            echo '```'
            grep -E '^e: ' build.log | head -n 120 || true
            grep -E -A 12 '^\* What went wrong' build.log | head -n 80 || true
            grep -E 'AAPT: error|error: resource|ERROR:' build.log | head -n 40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save the debug signing key
        if: steps.keystore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.android/debug.keystore
          key: ${{ env.KEYSTORE_CACHE_KEY }}

      - name: Rename the APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk "shidur-${{ github.run_number }}.apk"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            cp app/build/outputs/apk/release/app-release.apk "shidur-${{ github.ref_name }}.apk"
            cp app/build/outputs/bundle/release/app-release.aab "shidur-${{ github.ref_name }}.aab"
          fi

      - name: Upload the APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: shidur-apk-${{ github.run_number }}
          path: shidur-${{ github.run_number }}.apk

      - name: Publish a GitHub pre-release with the APK
        if: github.ref_type == 'branch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Shidur build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: shidur-${{ github.run_number }}.apk
          body: |
            Development build ${{ github.run_number }} (version 1.0-dev.${{ github.run_number }}) of commit ${{ github.sha }}.
            Install: open this page on your phone and tap the .apk file, or run
            `adb install -r shidur-${{ github.run_number }}.apk` on a computer.

      - name: Publish the official release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Shidur ${{ github.ref_name }}
          prerelease: false
          generate_release_notes: true
          files: |
            shidur-${{ github.ref_name }}.apk
            shidur-${{ github.ref_name }}.aab
          body: |
            Install `shidur-${{ github.ref_name }}.apk` on Android 12 or newer, or get updates automatically with Obtainium.
            `shidur-${{ github.ref_name }}.aab` is the app bundle for Google Play.

      - name: Run unit tests
        id: tests
        run: |
          set -o pipefail
          gradle testDebugUnitTest 2>&1 | tee test.log

      - name: Show test failures in the summary
        if: failure() && steps.tests.outcome == 'failure'
        run: |
          {
            echo "## Test failures (copy everything in the box below)"
            echo '```'
            grep -E -B 2 -A 8 'FAILED$|^e: ' test.log | head -n 120 || true
            grep -E -A 12 '^\* What went wrong' test.log | head -n 40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
